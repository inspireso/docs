services:
  nginx-proxy:
    restart: always
    image: nginxproxy/nginx-proxy:1.7-alpine
    container_name: nginx-proxy
    environment:
      - ACME_HTTP_CHALLENGE_LOCATION=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/nginx/vhost:/etc/nginx/vhost.d
      - /opt/nginx/certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - html:/usr/share/nginx/html
    networks:
      - nginx
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 2G
  acme-companion:
    restart: always
    image: nginxproxy/acme-companion:2.6
    container_name: nginx-proxy-acme
    environment:
      - DEFAULT_EMAIL=your@email.address
    volumes_from:
      - nginx-proxy
    volumes:
      - /opt/nginx/certs:/etc/nginx/certs:rw
      - /opt/nginx/acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nginx
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 2G
  app:
    image: nginx
    networks:
      - nginx
    #image: grafana/grafana
    environment:
      - VIRTUAL_HOST=your.domain.name
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=your.domain.name
      - LETSENCRYPT_EMAIL=your@email.address
networks:
  nginx:
volumes:
  html: